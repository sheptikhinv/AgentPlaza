services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_plaza
      POSTGRES_USER: agent_plaza
      POSTGRES_PASSWORD: agent_plaza
    volumes:
      - plaza-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_plaza -d agent_plaza"]
      interval: 5s
      timeout: 3s
      retries: 10

  plaza:
    build: .
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=agent_plaza;Username=agent_plaza;Password=agent_plaza
      Security__ViewerToken: ${AGENT_PLAZA_VIEWER_TOKEN:-change-me-viewer}
    ports:
      - "5080:8080"
    volumes:
      - plaza-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  plaza-postgres:
  plaza-keys:
